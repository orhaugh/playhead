global:
  scrape_interval: 5s
scrape_configs:
  - job_name: otel-collector
    # The collector forwards other services' metrics: keep their job, the
    # OTLP service.name (clink-coordinator, clink-worker), rather than
    # relabelling it exported_job under the collector's.
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
